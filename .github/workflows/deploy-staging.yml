name: Deploy staging

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable image tag, e.g. sha-<full-git-sha>"
        required: true
        type: string
      git_ref:
        description: "Git ref/SHA for Ansible files (default: selected branch)"
        required: false
        type: string

concurrency:
  group: deploy-staging
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to prod-2
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ (github.event.workflow_run && github.event.workflow_run.head_sha) || inputs.git_ref || github.sha }}

      - name: Resolve image tag
        id: image
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            tag="sha-${{ github.event.workflow_run.head_sha }}"
          else
            tag="${{ inputs.image_tag }}"
          fi

          case "$tag" in
            sha-*) ;;
            *)
              echo "image_tag must start with sha-"
              exit 1
              ;;
          esac

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Vault access
        env:
          VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.request

          token = os.environ.get("VAULT_TOKEN", "")
          address = os.environ.get("VAULT_ADDR", "").rstrip("/")
          if not token:
              raise SystemExit("VAULT_TOKEN is empty")
          if token != token.strip():
              raise SystemExit("VAULT_TOKEN has leading/trailing whitespace")
          if not token.startswith(("hvs.", "hvb.", "s.")):
              raise SystemExit("VAULT_TOKEN does not look like a Vault token")
          request = urllib.request.Request(
              address + "/v1/kv/data/undermine-api/config",
              headers={"X-Vault-Token": token},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  print("vault_status=%d" % response.status)
          except urllib.error.HTTPError as error:
              raise SystemExit(
                  "Vault read failed with HTTP %d; check token/policy/address" % error.code
              )
          except urllib.error.URLError as error:
              raise SystemExit("Vault connection failed: %s" % error.reason)
          PY

      - name: Install Ansible
        run: |
          pip install "ansible-core~=2.19.0" hvac
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Write inventory
        run: |
          printf '%s\n' "${{ secrets.ANSIBLE_INVENTORY }}" > ansible/inventory.ini
          chmod 600 ansible/inventory.ini

      - name: Write Vault group vars
        run: |
          mkdir -p ansible/group_vars/all
          cat > ansible/group_vars/all/main.yml <<EOF
          hashicorp_vault_url: "${{ secrets.VAULT_ADDR }}"
          hashicorp_vault_token: "{{ lookup('env', 'VAULT_TOKEN') }}"
          hashicorp_vault_mount_point: kv
          hashicorp_vault_config_path: undermine-api/config
          hashicorp_vault_tokens_path: undermine-api/tokens
          hashicorp_vault_database_path: undermine-api/database
          hashicorp_vault_app_path: undermine-api/app
          EOF

      - name: Deploy staging
        working-directory: ansible
        env:
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          ansible-playbook -i inventory.ini playbook.yml \
            --tags staging \
            -e "api_image=ghcr.io/skufiks/undermine-api:${IMAGE_TAG}"

      - name: Health check
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          STAGING_URL="${STAGING_URL%/}"
          test -n "$STAGING_URL"
          case "$STAGING_URL" in
            https://*) ;;
            *)
              echo "STAGING_URL must start with https://"
              exit 1
              ;;
          esac
          curl -fsS "$STAGING_URL/health/ready"
