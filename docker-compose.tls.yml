# Optional TLS profile. Requires nginx.tls.conf and ./certs/{fullchain.pem,privkey.pem}.
#
#   cp nginx.tls.conf.example nginx.tls.conf
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# The base compose file keeps 8080 -> 80; here we also publish 80 and 443 and replace the nginx
# config with the TLS variant.

services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.tls.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
