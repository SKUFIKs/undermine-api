events {
    worker_connections 1024;
}

http {
    # Cache zone for build artefacts (see `proxy_cache` below).
    proxy_cache_path /var/cache/nginx/build levels=1:2 keys_zone=build_cache:32m max_size=4g inactive=7d use_temp_path=off;

    server {
        listen 80;

        location /health {
            return 200 'OK';
        }

        # Build files live in s3://<bucket>/builds/... (see S3__Bucket in docker-compose.yml).
        # The bucket name is stripped from the public URL, so manifests can use
        # http://<host>/builds/<buildId>/... exactly as described in BUILD_SERVICE.md.
        # Keep the bucket name in sync with S3__Bucket when you change it.
        location /builds/ {
            proxy_pass http://minio:9000/minecraft-builds/builds/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Enable caching for static files
            proxy_cache build_cache;
            proxy_cache_valid 200 7d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;

            # CORS headers for launcher
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD" always;
            add_header Access-Control-Allow-Headers "*" always;
        }

        location / {
            # Proxy to MinIO S3
            proxy_pass http://minio:9000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Enable caching for static files
            proxy_cache build_cache;
            proxy_cache_valid 200 7d;
            proxy_cache_valid 404 1m;

            # CORS headers for launcher
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD" always;
            add_header Access-Control-Allow-Headers "*" always;
        }
    }
}
