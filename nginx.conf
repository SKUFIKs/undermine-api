events {
    worker_connections 1024;
}

http {
    # Cache zone for build artefacts (see `proxy_cache` below).
    proxy_cache_path /var/cache/nginx/build levels=1:2 keys_zone=build_cache:32m max_size=4g inactive=7d use_temp_path=off;

    server {
        listen 80;

        # Resolve Docker service names per request: an api/minio restart otherwise leaves nginx
        # pointing at a stale container IP.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8080;

        location /health {
            return 200 'OK';
        }

        # REST API. The API container is bound to loopback on the host; external clients use
        # this location. nginx is the only hop allowed to set X-Forwarded-* (see
        # ForwardedHeaders__KnownNetworks in docker-compose.yml).
        location /api/ {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # Modpack uploads are limited by [RequestSizeLimit] on the controller; nginx must
            # allow the same payload through instead of rejecting it with 413.
            client_max_body_size 1024m;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Admin panel (static SPA served by the API).
        location /admin/ {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /admin {
            return 308 /admin/;
        }

        # Prometheus scrape endpoint (direct API port when running locally).
        location = /metrics {
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # Build files live in s3://<bucket>/builds/... (see S3__Bucket in docker-compose.yml).
        # The bucket name is stripped from the public URL, so manifests can use
        # http://<host>/builds/<buildId>/... exactly as described in BUILD_SERVICE.md.
        # Keep the bucket name in sync with S3__Bucket when you change it.
        location /builds/ {
            proxy_pass http://minio:9000/minecraft-builds/builds/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Enable caching for static files
            proxy_cache build_cache;
            proxy_cache_valid 200 7d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status always;

            # CORS headers for launcher
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD" always;
            add_header Access-Control-Allow-Headers "*" always;
        }

        location / {
            # Proxy to MinIO S3
            proxy_pass http://minio:9000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Enable caching for static files
            proxy_cache build_cache;
            proxy_cache_valid 200 7d;
            proxy_cache_valid 404 1m;

            # CORS headers for launcher
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, HEAD" always;
            add_header Access-Control-Allow-Headers "*" always;
        }
    }
}
