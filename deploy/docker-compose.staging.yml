services:
  api:
    image: ${API_IMAGE}
    container_name: undermine-api-staging
    env_file:
      - path: .env.staging
        format: raw
    network_mode: host
    environment:
      ASPNETCORE_URLS: http://127.0.0.1:5000
      Kestrel__Endpoints__Http__Url: http://127.0.0.1:5000
      ForwardedHeaders__KnownNetworks: 127.0.0.1/32
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    volumes:
      - /srv/undermine/staging/builds:/app/builds
      - /srv/undermine/staging/java:/app/java
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5000/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
