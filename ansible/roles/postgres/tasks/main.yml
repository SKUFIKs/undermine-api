---
- name: Run common PostgreSQL tasks
  ansible.builtin.include_tasks: common.yml

- name: Configure Primary Node
  ansible.builtin.include_tasks: primary.yml
  when: inventory_hostname in groups['prod_primary']

- name: Configure Streaming Replica
  ansible.builtin.include_tasks: replica.yml
  when: inventory_hostname in groups['prod_standby']

- name: Configure Staging Cluster
  ansible.builtin.include_tasks: staging.yml
  when: inventory_hostname in groups['prod_standby']

- name: Configure Backups (pgBackRest)
  ansible.builtin.include_tasks: backup.yml
