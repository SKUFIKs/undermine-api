# Copy to inventory.ini (git-ignored) and replace every placeholder.
#
#   Copy-Item inventory.example.ini inventory.ini
#
# Never commit the real file: this repository is public.
# Use DNS names or IPs, but keep them out of git.
#
# ansible_user is the bootstrap account that already has sudo. The common role
# creates `deploy` and installs the same SSH key, so you can switch to it after
# the first run.

[prod_primary]
prod-1-se ansible_host=203.0.113.10 ansible_port=2222 ansible_user=deploy

[prod_standby]
prod-2-de ansible_host=203.0.113.20 ansible_port=2222 ansible_user=deploy

[prod_dr]
prod-3-rf ansible_host=203.0.113.30 ansible_port=2222 ansible_user=deploy

[staging]
staging-1 ansible_host=203.0.113.21 ansible_port=2222 ansible_user=deploy

[all:vars]
ansible_python_interpreter=/usr/bin/python3
# Host key checking stays on; keys are trusted on the first manual SSH connection.
ansible_ssh_common_args=-o StrictHostKeyChecking=accept-new

[garage:children]
prod_primary
prod_standby
prod_dr
