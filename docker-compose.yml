services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: undermine
      POSTGRES_USER: undermine
      POSTGRES_PASSWORD: undermine_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: dhi.io/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - minio_data:/data:ro
    depends_on:
      - minio

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__PostgreConnection: Host=postgres;Database=undermine;Username=undermine;Password=undermine_secret
      Jwt__Key: "wZsQA36ZDPz8pACMCbRO8lGIThBrA9W5"
      Jwt__Issuer: "UnderMine"
      Jwt__Audience: "UnderMine"
      S3__Endpoint: minio:9000
      S3__AccessKey: minioadmin
      S3__SecretKey: minioadmin
      S3__Bucket: minecraft-builds
      S3__UseSsl: "false"
      S3__CdnBaseUrl: http://localhost:8080
      Build__RootPath: /app/builds
      # Free API key from https://console.curseforge.com/ - required to import CurseForge
      # modpacks (their manifests reference files by projectID/fileID only).
      # Put CurseForgeApiKey into a .env next to docker-compose.yml.
      CurseForge__ApiKey: "${CurseForgeApiKey:-}"
    volumes:
      - builds_data:/app/builds
    depends_on:
      - postgres
      - minio

volumes:
  postgres_data:
  minio_data:
  builds_data:
