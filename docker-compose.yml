services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-}
      POSTGRES_USER: ${POSTGRES_USER:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    # Bound to loopback: the database is an internal service and must not be reachable from
    # outside the host. Use `docker compose exec postgres psql ...` for maintenance.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  minio:
    # Pin this to the digest of the MinIO release you actually deploy:
    #   docker image inspect dhi.io/minio:latest --format '{{json .RepoDigests}}'
    image: ${MINIO_IMAGE:-dhi.io/minio:latest}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    # Loopback only: browsers/launchers fetch build files through nginx (port 8080).
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      # The hardened MinIO image ships no curl/mc/wget; bash's /dev/tcp proves the S3 port is
      # accepting connections.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9000'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      # frontend carries the /api and /admin traffic; backend is needed to read MinIO objects.
      - frontend
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Local debug access only. Public clients (launcher/admin) use nginx on port 8080,
    # which is the only component allowed to send X-Forwarded-* headers.
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
      # X-Forwarded-For/Proto are trusted only from the frontend subnet (nginx + api).
      ForwardedHeaders__Enabled: "${ForwardedHeaders__Enabled:-true}"
      ForwardedHeaders__ForwardLimit: "${ForwardedHeaders__ForwardLimit:-1}"
      ForwardedHeaders__KnownNetworks: "${PROXY_SUBNET:-172.28.0.0/24}"
      ForwardedHeaders__KnownProxies: "${ForwardedHeaders__KnownProxies:-}"
      # How long the ban/role state behind an issued JWT is cached (seconds).
      Access__BanCacheSeconds: "${Access__BanCacheSeconds:-30}"
      # Browser origins allowed to call the API cross-origin (comma-separated).
      # Empty in Production = same-origin only (admin panel and launcher).
      CORS__AllowedOrigins: "${CORS__AllowedOrigins:-}"
      CORS__AllowCredentials: "${CORS__AllowCredentials:-false}"
      Security__HstsMaxAgeDays: "${Security__HstsMaxAgeDays:-365}"
      # Startup migrations retry while PostgreSQL is coming up, then the API exits non-zero.
      Database__MigrateRetries: "${Database__MigrateRetries:-10}"
      Database__MigrateRetryDelaySeconds: "${Database__MigrateRetryDelaySeconds:-2}"
      # Registration abuse limits (device/subnet quotas + strict create-account rate limit).
      Registration__MaxAccountsPerDevice: "${Registration__MaxAccountsPerDevice:-2}"
      Registration__MaxAccountsPerIp: "${Registration__MaxAccountsPerIp:-4}"
      Registration__Ipv4PrefixLength: "${Registration__Ipv4PrefixLength:-32}"
      Registration__Ipv6PrefixLength: "${Registration__Ipv6PrefixLength:-64}"
      Registration__DeviceIdMinLength: "${Registration__DeviceIdMinLength:-16}"
      Registration__DeviceIdMaxLength: "${Registration__DeviceIdMaxLength:-128}"
      RateLimiting__Api__PermitLimit: "${RateLimiting__Api__PermitLimit:-120}"
      RateLimiting__Api__WindowSeconds: "${RateLimiting__Api__WindowSeconds:-60}"
      RateLimiting__Admin__PermitLimit: "${RateLimiting__Admin__PermitLimit:-600}"
      RateLimiting__Admin__WindowSeconds: "${RateLimiting__Admin__WindowSeconds:-60}"
      RateLimiting__Auth__PermitLimit: "${RateLimiting__Auth__PermitLimit:-20}"
      RateLimiting__Auth__WindowSeconds: "${RateLimiting__Auth__WindowSeconds:-60}"
      RateLimiting__Register__PermitLimit: "${RateLimiting__Register__PermitLimit:-10}"
      RateLimiting__Register__WindowSeconds: "${RateLimiting__Register__WindowSeconds:-600}"
      RateLimiting__Reports__PermitLimit: "${RateLimiting__Reports__PermitLimit:-10}"
      RateLimiting__Reports__WindowSeconds: "${RateLimiting__Reports__WindowSeconds:-600}"
      Reports__RetentionDays: "${Reports__RetentionDays:-90}"
      Reports__RetentionIntervalHours: "${Reports__RetentionIntervalHours:-24}"
      RateLimiting__Static__PermitLimit: "${RateLimiting__Static__PermitLimit:-1000}"
      RateLimiting__Static__WindowSeconds: "${RateLimiting__Static__WindowSeconds:-10}"
      ConnectionStrings__PostgreConnection: Host=${POSTGRES_HOST:-};Port=${POSTGRES_PORT:-};Database=${POSTGRES_DB:-};Username=${POSTGRES_USER:-};Password=${POSTGRES_PASSWORD:-}
      Jwt__Key: "${Jwt__Key:-}"
      Jwt__Issuer: "${Jwt__Issuer:-}"
      Jwt__Audience: "${Jwt__Audience:-}"
      S3__Endpoint: ${S3__Endpoint:-}
      S3__AccessKey: ${S3__AccessKey:-}
      S3__SecretKey: ${S3__SecretKey:-}
      S3__Bucket: ${S3__Bucket:-}
      S3__UseSsl: ${S3__UseSsl:-}
      S3__CdnBaseUrl: ${S3__CdnBaseUrl:-}
      Build__RootPath: /app/builds
      # Temurin JRE archives served to launchers (downloaded once, then cached on this volume).
      JavaRuntime__RootPath: /app/java
      JavaRuntime__CacheHours: "${JavaRuntime__CacheHours:-24}"
      Build__LogRetentionDays: "${Build__LogRetentionDays:-30}"
      Build__LogRetentionIntervalHours: "${Build__LogRetentionIntervalHours:-24}"
      Build__LogRetentionMaxPerBuild: "${Build__LogRetentionMaxPerBuild:-0}"
      # Free API key from https://console.curseforge.com/ - required to import CurseForge
      # modpacks (their manifests reference files by projectID/fileID only).
      # Put CurseForgeApiKey into a .env next to docker-compose.yml.
      CurseForge__ApiKey: "${CurseForgeApiKey:-}"
      # First-run admin bootstrap (see AdminBootstrapService). On a fresh DB it creates an admin
      # with a random login/password and prints them to the log. Set Enabled=false to disable.
      # Set BOTH Username and Password to use fixed credentials (also doubles as password reset).
      BootstrapAdmin__Enabled: "${BootstrapAdminEnabled:-true}"
      BootstrapAdmin__Username: "${BootstrapAdminUsername:-}"
      BootstrapAdmin__Password: "${BootstrapAdminPassword:-}"
    volumes:
      - builds_data:/app/builds
      - java_data:/app/java
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # /health/ready checks PostgreSQL only; MinIO availability is reported by /health.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      # Migrations run before Kestrel starts listening.
      start_period: 60s
    restart: unless-stopped
    networks:
      - backend
      - frontend

volumes:
  postgres_data:
  minio_data:
  builds_data:
  java_data:

networks:
  # Only nginx and the API are attached here, so trusting this subnet for X-Forwarded-* cannot be
  # abused by database/storage containers. The subnet is configurable to avoid clashes with the
  # host network.
  frontend:
    ipam:
      config:
        - subnet: ${PROXY_SUBNET:-172.28.0.0/24}
  backend:
